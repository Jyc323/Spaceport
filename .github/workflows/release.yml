name: Release

# Push a tag like v0.1.0 to build the app and publish a GitHub Release with the zip attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/build.sh --universal
      - name: Zip
        run: ditto -c -k --keepParent build/Spaceport.app "Spaceport-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Spaceport-${{ github.ref_name }}.zip
          generate_release_notes: true
